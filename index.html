<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d2b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>NoroesteBio Pediluvios</title><style>
:root{--g:#153d2b;--g2:#2f6a4b;--bg:#f4f6f4;--card:#fff;--muted:#647067;--danger:#a52727;--warn:#9a6510}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#17201a}header{position:sticky;top:0;z-index:4;background:var(--g);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px}header img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:contain}.brandGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.brandCard{border:2px solid #dfe7e1;border-radius:14px;overflow:hidden;background:#fff}.brandCard .hero{width:100%;height:170px;object-fit:cover;display:block}.brandCard .brandLogo{height:54px;max-width:150px;object-fit:contain;display:block;margin:10px auto}.brandCard .pad{padding:0 12px 12px}.brandCard h3{margin:6px 0}.miniBrand{display:flex;align-items:center;gap:8px}.miniBrand img{width:62px;height:38px;object-fit:contain;background:#fff;border-radius:6px}.comparePhoto{width:110px;height:72px;object-fit:cover;border-radius:8px}.compareLogo{width:82px;height:42px;object-fit:contain;background:#fff}@media(max-width:700px){.brandGrid{grid-template-columns:1fr}.brandCard .hero{height:190px}}header b{font-size:18px}header small{display:block;opacity:.8}.wrap{max-width:1180px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button{background:#e4ebe6;white-space:nowrap}.tabs button.active,.btn.primary{background:var(--g);color:#fff}.btn.secondary{background:#e5ebe6}.btn.danger{background:#f8dfdf;color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 6px #00000012;margin-bottom:12px}.card h2,.card h3{margin:0 0 12px}.field{margin-bottom:11px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.req:after{content:' *';color:#b32222}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd3cd;border-radius:9px;background:#fff;font-size:16px}textarea{min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.money{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8efe9;font-size:12px;font-weight:700}.warn{background:#fff4d7;border-left:4px solid #d18b17;padding:10px;border-radius:8px}.err{background:#fde8e8;border-left:4px solid #b32222;padding:10px;border-radius:8px}.ok{background:#e8f5eb;border-left:4px solid #2e7d45;padding:10px;border-radius:8px}.photoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photo{border:1px dashed #aab5ad;border-radius:10px;padding:7px}.photo img{width:100%;height:110px;object-fit:cover;border-radius:7px}.listItem{border-bottom:1px solid #e7ece8;padding:11px 0;display:flex;justify-content:space-between;gap:10px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e2e7e3;text-align:left}th{background:#f0f4f1}.stickyActions{position:sticky;bottom:0;background:#ffffffee;padding:10px;border-radius:12px;box-shadow:0 -2px 8px #0001}.sectionTitle{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:8px 0}.compare{overflow:auto}.compare table{min-width:760px}@media(max-width:700px){.grid,.g3{grid-template-columns:1fr}.photoGrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.card{padding:13px}}
</style></head><body><header><img src="logo-noroestebio.jpg" alt="NoroesteBio"><div><b>NoroesteBio · Pediluvios</b><small>Ganadería Inteligente · CORE V1.1</small></div></header><div class="wrap"><div class="tabs" id="tabs"></div><main id="app"></main></div><script src="tarifas.js"></script><script>
const DELIVERY='Plazo estimado de entrega: 4 semanas desde la confirmación del pedido y el pago de los equipos, antes de su salida de fábrica.';
const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n||0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let state={view:'home',current:null};
const DB='nb_pediluvios_v1'; const loadAll=()=>JSON.parse(localStorage.getItem(DB)||'[]'); const saveAll=a=>localStorage.setItem(DB,JSON.stringify(a));
function blank(){return{id:uid(),created:new Date().toISOString(),status:'BORRADOR',client:{farm:'',contact:'',phone:'',email:'',address:'',province:'',gps:''},site:{type:'',cows:'',width:'',length:'',passage:'',waterDistance:'',powerDistance:'',productDistance:'',drainage:'',floor:'',obstacles:'',notes:''},photos:[],need:'',options:[],selectedOption:null,commercial:{validity:'30 días',iva:21,notes:''}}}
function persist(){if(!state.current)return;let a=loadAll(),i=a.findIndex(x=>x.id===state.current.id);state.current.updated=new Date().toISOString();if(i<0)a.unshift(state.current);else a[i]=state.current;saveAll(a)}
function tabs(){let arr=[['home','Visitas'],['edit','Visita'],['compare','Comparar'],['quotes','Presupuestos'],['rates','Tarifas']];document.getElementById('tabs').innerHTML=arr.map(([v,t])=>`<button class="${state.view===v?'active':''}" onclick="go('${v}')">${t}</button>`).join('')}
function go(v){state.view=v;render()};function render(){tabs();({home,edit,compare,quotes,rates}[state.view]||home)()}
function home(){let a=loadAll();app.innerHTML=`<div class=card><h2>Visitas y presupuestos</h2><p class=muted>Una ficha por ganadería. Medidas, fotos, comparación y presupuesto en el mismo sitio.</p><button class="btn primary" onclick="newVisit()">+ Nueva visita</button></div><div class=card><h3>Guardados (${a.length})</h3>${a.length?a.map(x=>`<div class=listItem><div><b>${esc(x.client.farm||'Sin nombre')}</b><div class=muted>${esc(x.client.province||'')} · ${x.status}</div></div><div><button class="btn secondary" onclick="openVisit('${x.id}')">Abrir</button></div></div>`).join(''):'<p class=muted>No hay visitas todavía.</p>'}</div>`}
function newVisit(){state.current=blank();persist();state.view='edit';render()} function openVisit(id){state.current=loadAll().find(x=>x.id===id);state.view='edit';render()}
function set(path,val){let o=state.current,ks=path.split('.');for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks.at(-1)]=val;persist()}
function edit(){if(!state.current)return home();let x=state.current;app.innerHTML=`<div class=card><h2>${esc(x.client.farm||'Nueva visita')}</h2><span class=pill>${x.status}</span></div>
<div class=card><h3>1. Ganadería</h3><div class=grid>${f('Ganadería','client.farm',x.client.farm,1)}${f('Persona de contacto','client.contact',x.client.contact,1)}${f('Teléfono','client.phone',x.client.phone,1,'tel')}${f('Email','client.email',x.client.email,0,'email')}${f('Dirección','client.address',x.client.address,1)}${f('Provincia','client.province',x.client.province,1)}</div><div class=row><button class="btn secondary" onclick="gps()">📍 Guardar ubicación</button><span class=muted>${esc(x.client.gps||'Sin ubicación GPS')}</span></div></div>
<div class=card><h3>2. Zona de instalación</h3><div class=grid>${sel('Tipo de instalación','site.type',x.site.type,['Sala de ordeño','Robot','Pasillo de retorno','Otra'],1)}${f('Nº aproximado de vacas','site.cows',x.site.cows,1,'number')}${f('Ancho libre disponible (m)','site.width',x.site.width,1,'number')}${f('Largo libre disponible (m)','site.length',x.site.length,1,'number')}${f('Ancho de paso de animales (m)','site.passage',x.site.passage,1,'number')}${f('Distancia a toma de agua (m)','site.waterDistance',x.site.waterDistance,1,'number')}${f('Distancia a electricidad (m)','site.powerDistance',x.site.powerDistance,1,'number')}${f('Distancia bomba-producto (m)','site.productDistance',x.site.productDistance,0,'number')}${sel('Desagüe disponible','site.drainage',x.site.drainage,['Sí','No','A confirmar'],1)}${sel('Estado del suelo','site.floor',x.site.floor,['Hormigón correcto','Requiere adaptación','Irregular','A confirmar'],1)}</div>${ta('Obstáculos / puertas / arrobaderas','site.obstacles',x.site.obstacles)}${ta('Observaciones de instalación','site.notes',x.site.notes)}</div>
<div class=card><h3>3. Fotografías</h3><p class=muted>Haz fotos de la zona general, entrada/salida de animales y conexiones. Cada foto puede llevar observación.</p><input id=photoInput type=file accept="image/*" capture="environment" multiple onchange="addPhotos(this.files)"><div class=photoGrid>${x.photos.map((p,i)=>`<div class=photo><img src="${p.data}"><input placeholder="Observación" value="${escAttr(p.note||'')}" onchange="photoNote(${i},this.value)"><button class="btn danger" onclick="delPhoto(${i})">Quitar</button></div>`).join('')}</div></div>
<div class=card><h3>4. Necesidad del cliente</h3>${ta('Problema / objetivo','need',x.need,1)}</div>
<div class=card><h3>5. Soluciones</h3><p class=muted>Selecciona uno o varios sistemas reales para configurar y comparar.</p>${brandSelector()}<div style="height:12px"></div>${x.options.map((o,i)=>optionCard(o,i)).join('')}</div>
<div class="stickyActions row"><button class="btn secondary" onclick="persist();alert('Borrador guardado')">Guardar borrador</button><button class="btn primary" onclick="go('compare')">Comparar</button><button class="btn primary" onclick="closeQuote()">Cerrar presupuesto</button></div>`}
function f(l,p,v,r,t='text'){return`<div class=field><label class="${r?'req':''}">${l}</label><input type=${t} step="any" value="${escAttr(v)}" onchange="set('${p}',this.value)"></div>`}function ta(l,p,v,r=0){return`<div class=field><label class="${r?'req':''}">${l}</label><textarea onchange="set('${p}',this.value)">${esc(v)}</textarea></div>`}function sel(l,p,v,opts,r){return`<div class=field><label class="${r?'req':''}">${l}</label><select onchange="set('${p}',this.value)"><option value="">Seleccionar…</option>${opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`}
function addOption(brand){let o={id:uid(),brand,model:'',margin:brand==='HOOFCOUNT'?30:'',extras:0,notes:''};state.current.options.push(o);persist();render()}
function updateOpt(i,k,v){state.current.options[i][k]=v;persist();render()}
function calc(o){if(o.brand==='OAK'){let base=TARIFAS.oak[0],add=TARIFAS.oak[1],zones=Number(o.zones||0),sale=base.sale+zones*add.sale+350+zones*150+350,cost=(base.cost||0)+zones*(add.cost||0);return{sale,cost,profit:sale-cost,desc:`Pediluvio OAK${zones?` + ${zones} zona(s) adicional(es)`:''}`}}
if(o.brand==='HOOFCOUNT'){let m=TARIFAS.hoofcount.find(x=>x.model===o.model);if(!m)return{sale:0,cost:0,profit:0,desc:'Seleccionar modelo'};let margin=Number(o.margin||30)/100,sale=m.cost/(1-margin)+m.install+m.shipping+Number(o.extras||0);return{sale,cost:m.cost+m.install+m.shipping,profit:sale-(m.cost+m.install+m.shipping),desc:m.model}}
let m=TARIFAS.ows.find(x=>x.ref===o.model);if(!m)return{sale:0,cost:0,profit:0,desc:'Seleccionar modelo'};let complete=m.category.includes('EQUIPOS COMPLETOS'),sale=m.list*(1+TARIFAS.ows_settings.markup)+(complete?TARIFAS.ows_settings.install+TARIFAS.ows_settings.shipping:0)+Number(o.extras||0),cost=m.list*(1-TARIFAS.ows_settings.discount)+(complete?TARIFAS.ows_settings.install+TARIFAS.ows_settings.shipping:0);return{sale,cost,profit:sale-cost,desc:m.description,note:m.notes}}
function brandAsset(brand){if(brand==='OAK')return{logo:'logo-autospray.png',photo:'photo-oak.jpg',label:'AUTO-SPRAY · OAK'};if(brand==='HOOFCOUNT')return{logo:'logo-hoofcount.png',photo:'photo-hoofcount.jpg',label:'HoofCount'};return{logo:'logo-huesker.png',photo:'photo-ows.jpg',label:'HUESKER · OWS'}}
function brandSelector(){return `<div class=brandGrid>${[['OAK','AUTO-SPRAY · OAK'],['HOOFCOUNT','HoofCount'],['OWS','HUESKER · OWS']].map(([b,t])=>{let a=brandAsset(b);return `<div class=brandCard><img class=hero src="${a.photo}" alt="${t}"><img class=brandLogo src="${a.logo}" alt="${t}"><div class=pad><h3>${t}</h3><button class="btn primary" onclick="addOption('${b}')">+ Añadir al estudio</button></div></div>`}).join('')}</div>`}
function optionCard(o,i){let c=calc(o), model='';if(o.brand==='OAK')model=`${f2('Zonas adicionales',i,'zones',o.zones||0,'number')}`;if(o.brand==='HOOFCOUNT')model=`${optSelect(i,'model',o.model,TARIFAS.hoofcount.map(x=>x.model))}${f2('Margen sobre venta (%)',i,'margin',o.margin||30,'number')}${f2('Extras (€)',i,'extras',o.extras||0,'number')}`;if(o.brand==='OWS')model=`${optSelect(i,'model',o.model,TARIFAS.ows.map(x=>`${x.ref} | ${x.description}`),true)}${f2('Extras (€)',i,'extras',o.extras||0,'number')}`;let a=brandAsset(o.brand);return`<div class=card style="background:#f8faf8"><div class=row style="justify-content:space-between;align-items:center"><div class=miniBrand><img src="${a.logo}"><b>${a.label}</b></div><button class="btn danger" onclick="state.current.options.splice(${i},1);persist();render()">Eliminar</button></div><div class=grid>${model}</div><div class=grid><div><span class=muted>Coste interno</span><div class=money>${euro(c.cost)}</div></div><div><span class=muted>Venta calculada</span><div class=money>${euro(c.sale)}</div></div></div><p><b>Beneficio estimado:</b> ${euro(c.profit)}</p>${c.note?`<div class=warn>⚠ ${esc(c.note)}</div>`:''}</div>`}
function f2(l,i,k,v,t){return`<div class=field><label>${l}</label><input type=${t} step=any value="${v}" onchange="updateOpt(${i},'${k}',this.value)"></div>`}function optSelect(i,k,v,opts,ows=false){return`<div class=field><label class=req>Modelo / configuración</label><select onchange="updateOpt(${i},'${k}',this.value)"><option value="">Seleccionar…</option>${opts.map(s=>{let val=ows?s.split(' | ')[0]:s;return`<option value="${escAttr(val)}" ${v===val?'selected':''}>${esc(s)}</option>`}).join('')}</select></div>`}
function compare(){if(!state.current)return home();let x=state.current;app.innerHTML=`<div class=card><h2>Comparador · ${esc(x.client.farm||'Visita')}</h2><p class=muted>Comparación interna. Costes y beneficio nunca aparecen en el presupuesto del cliente.</p><div class=compare><table><tr><th>Elegir</th><th>Sistema</th><th>Instalación</th><th>Modelo</th><th>Coste interno</th><th>Venta</th><th>Beneficio</th></tr>${x.options.map(o=>{let c=calc(o),a=brandAsset(o.brand);return`<tr><td><input type=radio name=sel ${x.selectedOption===o.id?'checked':''} onchange="state.current.selectedOption='${o.id}';persist()"></td><td><img class=compareLogo src="${a.logo}" alt="${a.label}"><div>${a.label}</div></td><td><img class=comparePhoto src="${a.photo}" alt="${a.label}"></td><td>${esc(c.desc)}</td><td>${euro(c.cost)}</td><td><b>${euro(c.sale)}</b></td><td>${euro(c.profit)}</td></tr>`}).join('')}</table></div><br><button class="btn secondary" onclick="go('edit')">Volver a visita</button> <button class="btn primary" onclick="closeQuote()">Cerrar presupuesto elegido</button></div>`}
function missing(){let x=state.current,m=[];[['Ganadería',x.client.farm],['Contacto',x.client.contact],['Teléfono',x.client.phone],['Dirección',x.client.address],['Provincia',x.client.province],['Ubicación GPS',x.client.gps],['Tipo de instalación',x.site.type],['Nº vacas',x.site.cows],['Ancho libre',x.site.width],['Largo libre',x.site.length],['Ancho de paso',x.site.passage],['Distancia a agua',x.site.waterDistance],['Distancia a electricidad',x.site.powerDistance],['Desagüe',x.site.drainage],['Estado del suelo',x.site.floor],['Necesidad del cliente',x.need]].forEach(([n,v])=>{if(v===undefined||v===null||String(v).trim()==='')m.push(n)});if(x.photos.length<3)m.push('Mínimo 3 fotografías de la instalación');if(!x.options.length)m.push('Al menos una solución configurada');if(!x.selectedOption)m.push('Seleccionar solución en Comparar');else{let o=x.options.find(z=>z.id===x.selectedOption);if(!o||calc(o).sale<=0)m.push('Modelo/configuración de la solución seleccionada')}return m}
function closeQuote(){let m=missing();if(m.length){alert('No se puede cerrar el presupuesto. Falta:\n\n• '+m.join('\n• '));state.view='edit';render();return}state.current.status='LISTO PARA CLIENTE';persist();generateQuote()}
function generateQuote(){let x=state.current,o=x.options.find(z=>z.id===x.selectedOption),c=calc(o),iva=Number(x.commercial.iva||21),vat=c.sale*iva/100,total=c.sale+vat;let html=`<!doctype html><html><head><meta charset=utf-8><title>Presupuesto ${esc(x.client.farm)}</title><style>body{font-family:Arial;margin:42px;color:#17201a}h1{color:#153d2b}.box{border:1px solid #ddd;padding:16px;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.total{font-size:22px;font-weight:bold}.foot{margin-top:40px;font-size:12px;color:#555}</style></head><body><div style="display:flex;align-items:center;gap:14px"><img src="logo-noroestebio.jpg" style="width:82px;height:82px;object-fit:contain"><div><h1 style="margin:0">NOROESTEBIO</h1><b>GANADERÍA INTELIGENTE</b></div></div><h2>Presupuesto · Sistema de higiene de pezuñas</h2><div class=box><b>Cliente/Ganadería:</b> ${esc(x.client.farm)}<br><b>Contacto:</b> ${esc(x.client.contact)}<br><b>Dirección:</b> ${esc(x.client.address)}, ${esc(x.client.province)}<br><b>Fecha:</b> ${new Date().toLocaleDateString('es-ES')}</div><table><tr><th>Solución</th><th>Descripción</th><th>Importe</th></tr><tr><td>${esc(brandAsset(o.brand).label)}</td><td>${esc(c.desc)}</td><td>${euro(c.sale)}</td></tr><tr><td></td><td>IVA ${iva}%</td><td>${euro(vat)}</td></tr><tr><td></td><td class=total>TOTAL</td><td class=total>${euro(total)}</td></tr></table><div class=box><b>Condiciones:</b><p>${DELIVERY}</p><p>Validez del presupuesto: ${esc(x.commercial.validity)}.</p>${x.commercial.notes?`<p>${esc(x.commercial.notes)}</p>`:''}</div><div class=foot>NoroesteBio · 637 888 272 · 672 683 138 · info@noroestebio.com · www.noroestebio.com</div><script>window.print()<\/script></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close()}
function quotes(){let a=loadAll().filter(x=>x.status==='LISTO PARA CLIENTE');app.innerHTML=`<div class=card><h2>Presupuestos cerrados</h2>${a.length?a.map(x=>`<div class=listItem><div><b>${esc(x.client.farm)}</b><div class=muted>${new Date(x.updated||x.created).toLocaleDateString('es-ES')}</div></div><button class="btn secondary" onclick="openVisit('${x.id}')">Abrir</button></div>`).join(''):'<p class=muted>No hay presupuestos cerrados.</p>'}</div>`}
function rates(){app.innerHTML=`<div class=card><h2>Tarifas internas</h2><div class=warn>Uso interno NoroesteBio. No compartir esta pantalla con clientes.</div><h3>OAK</h3><table>${TARIFAS.oak.map(x=>`<tr><td>${esc(x.concept)}</td><td>${euro(x.sale)}</td></tr>`).join('')}</table><h3>HoofCount</h3><table>${TARIFAS.hoofcount.map(x=>`<tr><td>${esc(x.model)}</td><td>Coste ${euro(x.cost)}</td></tr>`).join('')}</table><h3>OWS</h3><table>${TARIFAS.ows.map(x=>`<tr><td>${esc(x.ref)}</td><td>${esc(x.description)}</td><td>${euro(x.list)}</td></tr>`).join('')}</table></div>`}
function gps(){if(!navigator.geolocation)return alert('GPS no disponible');navigator.geolocation.getCurrentPosition(p=>{state.current.client.gps=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;persist();render()},e=>alert('No se pudo guardar la ubicación. Revisa el permiso de ubicación.'))}
async function addPhotos(files){for(let file of files){let data=await compress(file);state.current.photos.push({data,note:''})}persist();render()}function compress(file){return new Promise(res=>{let im=new Image(),r=new FileReader();r.onload=e=>im.src=e.target.result;im.onload=()=>{let max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};r.readAsDataURL(file)})}function photoNote(i,v){state.current.photos[i].note=v;persist()}function delPhoto(i){state.current.photos.splice(i,1);persist();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
